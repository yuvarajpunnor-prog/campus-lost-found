<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Access | Campus Lost & Found Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <div class="brand-icon"><i class="fas fa-compass"></i></div>
        <div><span>Campus <span style="color: var(--secondary-color);">Lost & Found</span></span></div>
      </a>
      <a href="index.html" class="btn btn-sm btn-outline-custom">
        <i class="fas fa-arrow-left me-1"></i> Back to Home
      </a>
    </div>
  </nav>

  <!-- AUTHENTICATION FORM WRAPPER -->
  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

          <!-- Notice if already logged in -->
          <div id="already-logged-in" class="d-none"></div>

          <!-- Card Form -->
          <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            
            <div class="p-4 p-md-5 bg-white">
              
              <!-- Tabs Header -->
              <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded-pill" id="authTabs" role="tablist">
                <li class="nav-item" role="presentation">
                  <button class="nav-link active rounded-pill fw-bold py-2" id="login-tab-btn" data-bs-toggle="pill" data-bs-target="#login-pane" type="button" role="tab">
                    <i class="fas fa-right-to-bracket me-1"></i> Sign In
                  </button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link rounded-pill fw-bold py-2" id="register-tab-btn" data-bs-toggle="pill" data-bs-target="#register-pane" type="button" role="tab">
                    <i class="fas fa-user-plus me-1"></i> Register
                  </button>
                </li>
              </ul>

              <div class="tab-content" id="authTabsContent">
                
                <!-- LOGIN PANE -->
                <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
                  <div class="text-center mb-4">
                    <h3 class="fw-bold mb-1">Welcome Back</h3>
                    <p class="text-muted small">Sign in to manage your campus reports and track claims.</p>
                  </div>

                  <!-- Quick Demo Fillers for Viva Demo -->
                  <div class="mb-4 p-3 bg-light rounded-3 border">
                    <small class="text-muted fw-bold d-block mb-2"><i class="fas fa-lightbulb text-warning me-1"></i> College Viva Quick Fill:</small>
                    <div class="d-flex gap-2 flex-wrap">
                      <button type="button" class="btn btn-sm btn-outline-primary" onclick="fillDemoStudent()">
                        <i class="fas fa-user-graduate me-1"></i> Student (Rahul)
                      </button>
                      <button type="button" class="btn btn-sm btn-outline-danger" onclick="fillDemoAdmin()">
                        <i class="fas fa-shield-halved me-1"></i> Administrator
                      </button>
                    </div>
                  </div>

                  <form id="loginForm">
                    <div class="mb-3">
                      <label for="loginEmail" class="form-label">College Email</label>
                      <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fas fa-envelope text-muted"></i></span>
                        <input type="email" id="loginEmail" class="form-control" placeholder="name@campus.edu" required>
                      </div>
                    </div>

                    <div class="mb-4">
                      <label for="loginPassword" class="form-label">Password</label>
                      <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" required>
                      </div>
                    </div>

                    <button type="submit" id="loginSubmitBtn" class="btn btn-primary-custom w-100 justify-content-center py-2 fw-bold mb-3">
                      <i class="fas fa-right-to-bracket me-2"></i> Sign In
                    </button>
                  </form>
                </div>

                <!-- REGISTER PANE -->
                <div class="tab-pane fade" id="register-pane" role="tabpanel">
                  <div class="text-center mb-4">
                    <h3 class="fw-bold mb-1">Create Account</h3>
                    <p class="text-muted small">Join your college portal to report and recover belongings.</p>
                  </div>

                  <form id="registerForm">
                    <div class="mb-3">
                      <label for="regName" class="form-label">Full Name <span class="text-danger">*</span></label>
                      <input type="text" id="regName" class="form-control" placeholder="e.g. Rahul Sharma" required>
                    </div>

                    <div class="row g-2 mb-3">
                      <div class="col-md-6">
                        <label for="regEmail" class="form-label">College Email <span class="text-danger">*</span></label>
                        <input type="email" id="regEmail" class="form-control" placeholder="student@campus.edu" required>
                      </div>
                      <div class="col-md-6">
                        <label for="regStudentId" class="form-label">Student / Staff ID <span class="text-danger">*</span></label>
                        <input type="text" id="regStudentId" class="form-control" placeholder="e.g. CS2024-042" required>
                      </div>
                    </div>

                    <div class="mb-3">
                      <label for="regPhone" class="form-label">Phone Number <span class="text-danger">*</span></label>
                      <input type="tel" id="regPhone" class="form-control" placeholder="+1-555-0100" required>
                    </div>

                    <div class="row g-2 mb-4">
                      <div class="col-md-6">
                        <label for="regPassword" class="form-label">Password <span class="text-danger">*</span></label>
                        <input type="password" id="regPassword" class="form-control" placeholder="Min 6 characters" minlength="6" required>
                      </div>
                      <div class="col-md-6">
                        <label for="regConfirmPassword" class="form-label">Confirm Password <span class="text-danger">*</span></label>
                        <input type="password" id="regConfirmPassword" class="form-control" placeholder="Repeat password" minlength="6" required>
                      </div>
                    </div>

                    <button type="submit" id="regSubmitBtn" class="btn btn-primary-custom w-100 justify-content-center py-2 fw-bold">
                      <i class="fas fa-user-plus me-2"></i> Create Account
                    </button>
                  </form>
                </div>

              </div>
            </div>

          </div>

        </div>
      </div>
    </div>
  </main>

  <footer class="footer-custom">
    <div class="container text-center">
      <p class="mb-0 small">© 2026 Campus Lost & Found Portal • College Full-Stack Java Project</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
