# ===================================================================
# Campus Lost & Found Portal - Spring Boot Configuration
# ===================================================================

spring.application.name=campus-lost-found
server.port=8080

# Database profile:
# 'h2'    -> Embedded disk-persisted database (runs immediately with ZERO setup or password required)
# 'mysql' -> Local MySQL 8.0 database (configure credentials in application-mysql.properties)
spring.profiles.active=h2

# Multipart / File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JSON date formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
